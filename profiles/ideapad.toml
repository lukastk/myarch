name = "ideapad"
terminal = "kitty"
battery = "BAT1"
touchscreen = false
voxtype = true

[dictation]
# No gain compensation on this machine, so no source to scope it to. Both keys
# are required in every profile; see profiles/pocket4.toml for what they mean.
source_volume = "unchanged"
source_volume_source = ""

[plugins]
hyprexpo = true
hyprgrass = false

[external]
wallpaper_directory = "~/Pictures/wallpapers"

[packages]
# Built from packages/<name>/ with a myarch patch instead of installed from the
# repositories (install.sh, packages/install-patched). See each package's README.
patched = []
