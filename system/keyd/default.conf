# Managed by myrig — setup/installs/hyprland/keyd.py
#
# Caps Lock -> F12, on every Hyprland machine (ideapad, pocket4).
#
# Why keyd rather than an XKB option: there is no stock caps: option that emits
# a function key. `grep caps: /usr/share/X11/xkb/rules/base.lst` offers only
# Esc, Backspace, Return, Super, Ctrl and capitalization variants. keyd remaps
# at the evdev layer instead, so it applies to every compositor and TTY without
# per-app configuration.
#
# NOTE this means XKB never sees a capslock keycode any more, so the previous
# `grp:caps_toggle` layout switch can no longer fire — layout switching moved to
# the waybar language button (which already has an on-click handler).

[ids]
*

[main]
capslock = f12
