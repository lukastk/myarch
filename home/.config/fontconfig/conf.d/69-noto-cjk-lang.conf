<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Pick the RIGHT regional variant of Noto CJK per language.

  WHY THIS FILE EXISTS. Han characters are unified in Unicode: Japanese,
  Simplified Chinese, Traditional Chinese and Korean share code points but draw
  a good number of them differently (直 骨 令 次 海 内 画 …). Noto ships that as
  five separate families out of one .ttc — Noto Sans CJK JP/KR/SC/TC/HK — and
  the code point alone cannot tell fontconfig which to use. Only the LANGUAGE of
  the text can.

  Left alone, everything gets Korean glyphs. /etc/fonts/conf.d/65-nonlatin.conf
  names exactly one CJK family in its generic sans-serif/serif/monospace
  preference lists — "Noto Sans CJK KR", commented "<!- - hangul (ko) - ->" —
  with no JP/SC/TC entry anywhere. So it is not that KR is preferred over the
  others; the others are simply not in the running. Verified on pocket4
  2026-08-08: with noto-fonts-cjk freshly installed and nothing else configured,
  `fc-match ':lang=ja'` answered "Noto Sans CJK KR". Japanese pages render
  legibly and subtly wrong, which is the failure mode nobody reports as a bug.

  So each rule below says: when the text is language L and the requested family
  is a generic, put the L variant at the front.

  binding="strong" IS LOAD-BEARING, and the reason is the include ORDER.
  fontconfig pulls this whole directory in via /etc/fonts/conf.d/50-user.conf,
  i.e. at position *50* — BEFORE 65-nonlatin.conf. A plain (weak) prepend would
  therefore be prepended-over by 65-nonlatin a moment later and lose. Strong
  binding outranks weak in fontconfig's family comparison regardless of list
  position, which is what lets a file that loads early still win. Do not
  "simplify" these to <alias><prefer>: that sugar expands to a WEAK prepend, and
  the KR default comes straight back.

  Note that this file only makes the choice CORRECT — it is not what makes CJK
  render at all. That needs the fonts: the `noto-fonts-cjk` package, installed
  by myarch install.sh package manifest. Arch's `noto-fonts` does NOT contain
  CJK; missing it is what produced tofu (□□□) on every Japanese and Chinese site.

  zh is split three ways on purpose. zh-cn is Simplified, zh-tw Traditional, and
  zh-hk Traditional with the Hong Kong glyph set, which genuinely differs from
  Taiwan's. Testing a bare "zh" would fold them together and hand Hong Kong and
  Taiwan the Simplified forms.
-->
<fontconfig>

  <!-- Japanese -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>

  <!-- Korean. This is already what the system falls back to, but it is stated
       explicitly so the set is symmetric: the KR default is an accident of
       65-nonlatin.conf, not a decision, and a future fontconfig that drops that
       line would otherwise take Korean down with it. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
  </match>

  <!-- Chinese (Simplified) -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!-- Chinese (Traditional, Taiwan) -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>

  <!-- Chinese (Traditional, Hong Kong) -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>

</fontconfig>
