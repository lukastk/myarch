# hypridle — idle daemon: lock at 10 min, screen off at 15, suspend at 30.
#
# THREE THINGS OVERRIDE THIS, and they differ in what they suppress:
#
# - `redbull` (~/.mybin/redbull) — a time-boxed stay-awake. By default it
#   holds a logind sleep lock only, so the listeners below still lock and
#   blank on schedule and only the `systemctl suspend` is refused;
#   `redbull --screen-on` adds an `idle` lock, which hypridle honours by
#   dropping every idle event, so NO listener fires at all
#   (general:ignore_systemd_inhibit is false by default, and we keep it so).
# - The waybar idle_inhibitor module (the eye icon) — the same "nothing fires"
#   effect, held indefinitely on waybar's Wayland surface rather than through
#   logind. One click, no argument, but it dies with the bar.
# - Server mode — server-mode.service holds an indefinite logind sleep lock
#   (see `server-mode status` and setup/installs/server_mode/server_mode.py),
#   so the suspend listener's `systemctl suspend` is refused while the lock and
#   screen-off listeners still take effect. It is the boot default on ideapad
#   and off by default on pocket4, so the suspend listener below only actually
#   suspends in laptop mode.
#
# `redbull-status` reports which of the logind-backed ones are in force.

# Note: hyprctl dispatch takes Lua expressions (the hyprland config is
# hyprland.lua; classic dispatcher strings no longer parse).
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    # --no-ask-password: when server mode's inhibitor blocks the suspend, fail
    # non-interactively instead of routing through a polkit agent prompt.
    on-timeout = systemctl suspend --no-ask-password
}
