# hyprpaper — the wallpaper daemon. Deliberately carries NO preload/wallpaper
# lines: the image is chosen at runtime by `wallpaper daemon` (~/.mybin/wallpaper,
# started from hyprland.lua's autostart block), which rotates over the
# ~/Pictures/wallpapers set every 20 minutes. Naming a file here would only fight
# it for the first tick of each session.
#
# There is nothing to preload either — hyprpaper 0.8.4 dropped the
# preload/unload/reload IPC requests entirely; `wallpaper <monitor>,<path>` loads
# on demand and evicts what it replaces.
splash = false
