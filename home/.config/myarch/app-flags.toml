# Launch flags myarch writes for Chromium-based apps, per desktop mode.
#
# Arch's `brave` and `obsidian` launchers read one flag per line from
# $XDG_CONFIG_HOME/<app>-flags.conf at every launch. Those files are GENERATED
# from this one by ~/.mybin/myarch-app-flags — at every myarch install, and by
# pocket4-tablet-mode on every toggle — so they always match the current mode.
# Edit this file, never the generated ones.
#
# A running app keeps the flags it was started with, so a launch flag reaches an
# app only when it next starts. The same command also records the current mode in
# $XDG_STATE_HOME/myarch/desktop-mode ("tablet" or "laptop") for apps that switch
# at runtime instead — Obsidian, through mysystem (see apps.obsidian).

# Flags added in tablet mode to every app with `tablet = true`.
#
# They make Chromium treat a finger as the PRIMARY pointer, so web pages and
# Electron apps see `(pointer: coarse)` and `(hover: none)` — exactly what a
# phone reports, and what their touch layouts key off: controls normally
# revealed on hover become always visible (YouTube's player controls,
# obako/mysystem's row actions and convo buttons in Obsidian).
#
# Without them pocket4 reports `pointer: fine` / `hover: hover` even with the
# keyboard folded away, because the touchpad still exists; the touchscreen only
# shows up as `any-pointer: coarse`. Enum values are Chromium's:
# PointerType NONE=1 COARSE=2 FINE=4, HoverType NONE=1 HOVER=2. Measured
# 2026-09-04 in Brave: these settings flip pointer:coarse and hover:none to true,
# and the inverse values flip them back, so it is a genuine override.
[tablet]
flags = ["--blink-settings=availablePointerTypes=2,primaryPointerType=2,availableHoverTypes=1,primaryHoverType=1"]

# Every app gets TouchTextEditingRedesign, in BOTH modes: the touchscreen is there
# with the keyboard out too. Chromium enables it by default only on ChromeOS. It
# adds long-press-and-keep-dragging selection: long-press a word, keep the finger
# down, and the selection follows it, without the separate handle drag that
# Hyprland breaks (it sends a pointer motion before every touch, and Chromium hides
# the handles on pointer motion). Measured 2026-09-17 in Brave 153 with a uinput
# touchscreen: the selection extended word by word. Side effects, from Chromium
# source: a horizontal swipe inside a text field moves the caret, and a long press
# on a link or on already-selected text starts drag-and-drop. Chromium honours only
# the LAST --enable-features switch, so a second feature must join this one
# (comma-separated) rather than add another --enable-features line.
[apps.brave]
file = "brave-flags.conf"
always = ["--ozone-platform-hint=auto", "--enable-features=TouchTextEditingRedesign"]
tablet = true

# Obsidian gets NO tablet launch flag. mysystem reads desktop-mode, watches it,
# and switches Obsidian's pointer emulation live when tablet mode toggles (and on
# every plugin load). A launch flag would work against that: Blink settings given
# at launch cannot be undone at runtime, so an Obsidian started in tablet mode
# stayed hover-less after switching back to laptop until it was restarted. The file
# carries only the mode-independent `always` flags.
[apps.obsidian]
file = "obsidian-flags.conf"
always = ["--enable-features=TouchTextEditingRedesign"]
tablet = false
