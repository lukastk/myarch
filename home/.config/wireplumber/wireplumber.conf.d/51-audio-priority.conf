# Which audio devices may auto-become the default sink/source.
#
# Two rules, both fixing the same class of bug: WirePlumber's stock priority
# ladder elects a device nobody chose, silently.
#
# NOTE FOR EDITORS: both rules live in ONE `monitor.alsa.rules` array. Declaring
# the key twice in this file does NOT merge - the second declaration REPLACES
# the first and the earlier rule vanishes with no error. Verify any change with
#   spa-json-dump 51-audio-priority.conf
# and check that both blocks are still there.
#
# ---------------------------------------------------------------------------
# 1. HDMI: prefer an attached display's audio over the built-in speakers.
#
# WirePlumber's ALSA monitor scores the internal analog sink 1009 (1000 base + 9
# for the `analog-` profile prefix) and every HDMI sink 632 (744 base for a
# non-zero ALSA device, minus 16*device, no profile bonus) - see
# /usr/share/wireplumber/scripts/monitors/alsa.lua:260-281. So a TV that is
# plugged in and working NEVER wins the default-sink election: the sink appears,
# stays SUSPENDED, and audio silently continues out of the laptop speakers.
#
# Without this rule the only thing aiming audio at a TV is the per-machine
# `default.configured.audio.sink` pin in ~/.local/state/wireplumber/default-nodes.
# That pin names ONE node, and the node name encodes ONE physical connector
# (`hdmi-stereo-extra1` = the GPU's HDMI 2 / ACP port hdmi-output-1). Move the
# cable to another port and the pin no longer matches, selection falls back to
# priority, and the speakers win again. That state directory is also excluded
# from the Borg backup (borgmatic config.yaml, `/home/<user>/.local/state`), so
# it is machine-local and unreproducible. This rule is port-independent.
#
# WHY THE MATCH IS ON device.profile.name: both audio cards on pocket4 report
# api.alsa.card.name = "HD-Audio Generic" (the GPU controller and the Realtek
# ALC245 alike), so matching the card name would catch the internal speakers too
# and defeat the whole rule. The ACP profile name is the one discriminator that
# is independent of connector, card and machine: `hdmi-*` vs `analog-stereo`.
#
# ---------------------------------------------------------------------------
# 2. DualSense: never let the controller auto-become the default device.
#
# Plugged in over USB, the DualSense enumerates as a UAC audio card (it carries
# a headphone jack and a speaker). alsa.lua scores a USB device 1000 + 100 for
# device.bus == usb = 1100 on output, and capture gets a further +1000 = 2100 on
# input. Both outrank everything built in (internal speakers 1009, internal mic
# 2009), so plugging the controller in merely to charge it silently moves ALL
# audio to the controller and ALL recording to its mic - the latter also
# hijacks voxtype dictation. A priority accident, not a policy anyone chose.
#
# The device is deliberately NOT disabled: plugging headphones into the
# controller is a legitimate thing to want while gaming. Demoting it keeps it
# present and selectable in pavucontrol/wpctl, and once you pick it that choice
# becomes the configured default and sticks. It just stops winning an election
# it was never meant to enter.
#
# Matched on node.name because the controller is usually absent, so there is no
# live node to match richer properties against; the ALSA card name is recorded
# in ~/.local/state/wireplumber/default-routes and node.name is built
# deterministically from it, covering every profile the card exposes (it
# presents a "Direct" profile, not "analog-stereo"). Unescaped `.` follows the
# upstream idiom in /usr/share/wireplumber/wireplumber.conf.d/alsa-vm.conf.
# Both media classes are listed so the mic is demoted alongside the speaker.
#
# ---------------------------------------------------------------------------
# The resulting ladder (priority.session, higher wins):
#   USB audio       1100   alsa.lua +100 for device.bus == usb
#   HDMI            1050   rule 1
#   Bluetooth A2DP  1010   bluez.lua:275
#   internal analog 1009
#   DualSense        500   rule 2
#
# Rules are applied AFTER the default priority is computed (alsa.lua:371), so
# update-props here overrides it rather than being overridden.

monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        device.profile.name = "~hdmi-.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1050
        priority.driver  = 1050
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Sony_Interactive_Entertainment_DualSense.*"
      }
      {
        node.name = "~alsa_input.usb-Sony_Interactive_Entertainment_DualSense.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 500
        priority.driver  = 500
      }
    }
  }
]
